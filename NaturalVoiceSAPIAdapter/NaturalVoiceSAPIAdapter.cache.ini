; NaturalVoiceSAPIAdapter Configuration
; Registry path: HKCU\Software\NaturalVoiceSAPIAdapter
;
; This file provides a reference of all configurable settings.
; Values shown are the defaults. Uncomment and modify as needed.

[NaturalVoiceSAPIAdapter]
; General settings (HKCU\Software\NaturalVoiceSAPIAdapter)

; Log file path (default: %TEMP%\NaturalVoiceSAPIAdapter\NaturalVoiceSAPIAdapter.log)
;LogFile=

; Log level: 0=trace, 1=debug, 2=info, 3=warn, 4=error, 5=critical, 6=off
LogLevel=0

; Log flush level: messages at or above this level are flushed immediately
LogFlushLevel=3

; Log flush interval in seconds (0 = no periodic flush)
LogFlushInterval=0

; Enable logging to debug console (OutputDebugString)
LogToConsole=0

; Enable websocketpp library logs
EnableWebsocketppLogs=0

; Enable crash dump generation
EnableCrashDump=0

; Crash dump type (MINIDUMP_TYPE flags)
;CrashDumpType=

; Force enable Azure Speech SDK on unsupported OS versions
ForceEnableAzureSpeechSDK=0

; Use Azure Speech SDK for Azure online voices
UseAzureSpeechSDKForAzureVoices=0

; Optimize delay when starting online voice synthesis
EnableOnlineDelayOptimization=0

; Cache audio source mode: "disk" or "server"
CacheAudioSourceMode=disk

; Cache audio server URL (when source mode is "server")
CacheAudioServerUrl=http://localhost:8880/serving/audio

; Cache audio base path for disk mode
CacheAudioBasePath=data/dialogues

[Enumerator]
; Voice enumerator settings (HKCU\Software\NaturalVoiceSAPIAdapter\Enumerator)

; Disable the adapter entirely
Disable=0

; Include Edge voices from all languages
EdgeVoiceAllLanguages=0

; Include all Edge multilingual voices
EdgeVoiceAllMultilingual=0

; Path to Narrator voice models
;NarratorVoicePath=

; Default error mode: 0=silent, 1=log, 2=throw
DefaultErrorMode=0

; Exclude Narrator/local voices
NoNarratorVoices=0

; Exclude Edge voices
NoEdgeVoices=0

; Edge voices override Azure voices with same ID
EdgeVoicesOverrideAzureVoices=0

; Exclude Azure voices
NoAzureVoices=0

; Azure Speech Service subscription key
;AzureVoiceKey=

; Azure Speech Service region
;AzureVoiceRegion=

; Fallback language tag for voices with unknown locale
;LanguageForUnknownLocales=

[Network]
; Network/proxy settings (HKCU\Software\NaturalVoiceSAPIAdapter\Network)

; Override system proxy settings
ProxyOverrideSystemDefault=0

; Proxy server address (e.g., http://proxy:8080)
;ProxyServer=

; Proxy bypass list (semicolon-separated)
;ProxyBypass=

; WebSocket connection pool minimum count
ConnectionPoolMinCount=1

; WebSocket connection pool maximum count (default: max(10, min count))
ConnectionPoolMaxCount=10

; Keep-alive ping interval in seconds
;ConnectionKeepAliveInterval=

; Keep-alive duration in seconds
;ConnectionKeepAliveDuration=

; Maximum connection age in seconds
;ConnectionMaxAge=

[CacheAudio]
; Cache audio INI file settings (read from NaturalVoiceSAPIAdapter.cache.ini)
; These are the same as the CacheAudio* settings above but read from a separate INI file.
; The INI file takes the same key names without the "CacheAudio" prefix:
;   SourceMode=disk
;   ServerUrl=http://localhost:8880/serving/audio
;   BasePath=data/dialogues
